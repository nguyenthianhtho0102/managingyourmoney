<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Theo Dõi Chi Tiêu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* THÊM MỚI: Style cho phần kiểm tra ngân sách */
        .budget-checker {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .budget-checker h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .budget-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .budget-input-group {
            display: flex;
            flex-direction: column;
        }

        .budget-input-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .budget-input-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .budget-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .budget-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .budget-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .budget-btn:active {
            transform: translateY(0);
        }

        /* THÊM MỚI: Kết quả kiểm tra ngân sách */
        .budget-result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        .budget-result.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .budget-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .budget-summary-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .budget-summary-item h4 {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .budget-summary-item .value {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
        }

        .budget-summary-item.spent .value {
            color: #f5576c;
        }

        .budget-summary-item.remaining .value {
            color: #28a745;
        }

        .budget-summary-item.remaining.negative .value {
            color: #dc3545;
        }

        .budget-summary-item.target .value {
            color: #667eea;
        }

        .budget-status {
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1em;
        }

        .budget-status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .budget-status.warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }

        .budget-status.danger {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @media (max-width: 968px) {
            .budget-form {
                grid-template-columns: 1fr;
            }

            .budget-summary {
                grid-template-columns: 1fr;
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 0.9em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-box .amount {
            font-size: 2em;
            font-weight: bold;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 300px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* THÊM MỚI: Style cho empty state của biểu đồ */
        .charts-empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #999;
            text-align: center;
        }

        .charts-empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .charts-empty-state h3 {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .charts-empty-state p {
            font-size: 1em;
            color: #666;
        }

        /* THÊM MỚI: Animation cho biểu đồ xuất hiện */
        .chart-container.show {
            animation: chartFadeIn 0.6s ease-out forwards;
        }

        @keyframes chartFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* THÊM MỚI: Ẩn biểu đồ khi chưa có dữ liệu */
        .chart-container.hidden {
            display: none;
        }

        .transaction-list {
            grid-column: 1 / -1;
        }

        .transactions {
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .transaction-item:hover {
            background: #f8f9ff;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .transaction-category {
            font-size: 0.9em;
            color: #666;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .category-food { background: #fff3cd; color: #856404; }
        .category-education { background: #d1ecf1; color: #0c5460; }
        .category-transport { background: #d4edda; color: #155724; }
        .category-entertainment { background: #f8d7da; color: #721c24; }
        .category-others { background: #e2e3e5; color: #383d41; }

        .transaction-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #f5576c;
            margin: 0 15px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #ee5a6f;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 968px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .charts {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        .transactions::-webkit-scrollbar {
            width: 8px;
        }

        .transactions::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .transactions::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .transactions::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Dashboard Quản Lý Chi Tiêu</h1>
            <p>Theo dõi và quản lý chi tiêu hằng ngày một cách thông minh</p>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>📝 Thêm Khoản Chi</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="expenseName">Tên khoản chi:</label>
                        <input type="text" id="expenseName" placeholder="Ví dụ: Ăn trưa tại trường" required>
                    </div>
                    <div class="form-group">
                        <label for="expenseAmount">Số tiền (VNĐ):</label>
                        <input type="number" id="expenseAmount" placeholder="Ví dụ: 25000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="expenseCategory">Danh mục:</label>
                        <select id="expenseCategory" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option value="food">🍔 Ăn uống (Food & Drinks)</option>
                            <option value="education">📚 Học tập (Education)</option>
                            <option value="transport">🚌 Di chuyển (Transport)</option>
                            <option value="entertainment">🎮 Giải trí (Entertainment)</option>
                            <option value="others">📦 Khác (Others)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">➕ Thêm Khoản Chi</button>
                </form>

                <div class="stats" style="margin-top: 30px;">
                    <div class="stat-box">
                        <h3>TỔNG CHI TIÊU</h3>
                        <div class="amount" id="totalAmount">0 đ</div>
                    </div>
                </div>
            </div>

            <!-- SỬA: Thêm ID cho phần charts để dễ thao tác -->
            <div class="card">
                <h2>📊 Thống Kê Chi Tiêu</h2>
                <div class="charts" id="chartsContainer">
                    <!-- THÊM: Empty state khi chưa có dữ liệu -->
                    <div class="charts-empty-state" id="chartsEmptyState">
                        <svg fill="#999" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                        </svg>
                        <h3>Chưa có dữ liệu thống kê</h3>
                        <p>Hãy thêm khoản chi đầu tiên để xem biểu đồ!</p>
                    </div>
                    <!-- THÊM: Class hidden để ẩn biểu đồ ban đầu -->
                    <div class="chart-container hidden" id="pieChartContainer">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div class="chart-container hidden" id="barChartContainer">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="card transaction-list">
            <h2>📋 Lịch Sử Chi Tiêu</h2>
            <div class="transactions" id="transactionList">
                <div class="empty-state">
                    <svg fill="#999" viewBox="0 0 24 24">
                        <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>
                    </svg>
                    <p>Chưa có khoản chi nào. Hãy thêm khoản chi đầu tiên!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = {
            food: { name: 'Ăn uống', icon: '🍔', color: '#ffc107' },
            education: { name: 'Học tập', icon: '📚', color: '#17a2b8' },
            transport: { name: 'Di chuyển', icon: '🚌', color: '#28a745' },
            entertainment: { name: 'Giải trí', icon: '🎮', color: '#dc3545' },
            others: { name: 'Khác', icon: '📦', color: '#6c757d' }
        };

        let expenses = [];
        let pieChart, barChart;

        window.addEventListener('DOMContentLoaded', () => {
            loadExpenses();
            initCharts();
            updateUI();
        });

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            addExpense();
        });

        function addExpense() {
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;

            if (!name || !amount || !category) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }

            const expense = {
                id: Date.now(),
                name: name,
                amount: amount,
                category: category,
                date: new Date().toLocaleDateString('vi-VN')
            };

            expenses.push(expense);
            saveExpenses();
            updateUI();

            document.getElementById('expenseForm').reset();
        }

        function deleteExpense(id) {
            if (confirm('Bạn có chắc muốn xóa khoản chi này?')) {
                expenses = expenses.filter(exp => exp.id !== id);
                saveExpenses();
                updateUI();
            }
        }

        function saveExpenses() {
            localStorage.setItem('studentExpenses', JSON.stringify(expenses));
        }

        function loadExpenses() {
            const stored = localStorage.getItem('studentExpenses');
            if (stored) {
                expenses = JSON.parse(stored);
            }
        }

        function updateUI() {
            updateTotal();
            updateTransactionList();
            updateCharts();
            // THÊM MỚI: Kiểm tra và toggle hiển thị biểu đồ
            toggleChartsVisibility();
        }

        function updateTotal() {
            const total = expenses.reduce((sum, exp) => sum + exp.amount, 0);
            document.getElementById('totalAmount').textContent = formatMoney(total);
        }

        function updateTransactionList() {
            const listEl = document.getElementById('transactionList');
            
            if (expenses.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <svg fill="#999" viewBox="0 0 24 24">
                            <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>
                        </svg>
                        <p>Chưa có khoản chi nào. Hãy thêm khoản chi đầu tiên!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = expenses.map(exp => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-name">${categories[exp.category].icon} ${exp.name}</div>
                        <span class="transaction-category category-${exp.category}">${categories[exp.category].name}</span>
                    </div>
                    <div class="transaction-amount">${formatMoney(exp.amount)}</div>
                    <button class="delete-btn" onclick="deleteExpense(${exp.id})">🗑️ Xóa</button>
                </div>
            `).join('');
        }

        // SỬA: Cấu hình biểu đồ với animation và tooltip hiển thị phần trăm
        function initCharts() {
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            const barCtx = document.getElementById('barChart').getContext('2d');

            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: []
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // THÊM: Cấu hình animation mượt mà
                    animation: {
                        animateRotate: true,
                        animateScale: true,
                        duration: 800,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 12
                                }
                            }
                        },
                        title: {
                            display: true,
                            text: 'Tỷ lệ chi tiêu theo danh mục',
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            padding: 20
                        },
                        // THÊM: Tooltip hiển thị đầy đủ thông tin
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${label}: ${formatMoney(value)} (${percentage}%)`;
                                }
                            }
                        },
                        // THÊM: Hiển thị phần trăm trên biểu đồ
                        datalabels: false
                    }
                },
                // THÊM: Plugin tùy chỉnh để hiển thị % trên biểu đồ
                plugins: [{
                    afterDatasetsDraw: function(chart) {
                        const ctx = chart.ctx;
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            if (!meta.hidden) {
                                meta.data.forEach((element, index) => {
                                    ctx.fillStyle = 'white';
                                    const fontSize = 14;
                                    const fontStyle = 'bold';
                                    const fontFamily = 'Arial';
                                    ctx.font = `${fontStyle} ${fontSize}px ${fontFamily}`;
                                    
                                    const dataString = dataset.data[index];
                                    const total = dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((dataString / total) * 100).toFixed(1);
                                    
                                    if (percentage > 5) {
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'middle';
                                        const position = element.tooltipPosition();
                                        ctx.fillText(`${percentage}%`, position.x, position.y);
                                    }
                                });
                            }
                        });
                    }
                }]
            });

            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Chi tiêu (VNĐ)',
                        data: [],
                        backgroundColor: []
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // THÊM: Cấu hình animation mượt mà
                    animation: {
                        duration: 800,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Chi tiêu theo danh mục',
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            padding: 20
                        },
                        // THÊM: Tooltip hiển thị đầy đủ
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `Chi tiêu: ${formatMoney(value)} (${percentage}%)`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return new Intl.NumberFormat('vi-VN').format(value) + 'đ';
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateCharts() {

    /* ===== PIE CHART: THEO DANH MỤC, TOOLTIP CHI TIẾT ===== */
    const categoryTotals = {};
    Object.keys(categories).forEach(k => categoryTotals[k] = 0);

    expenses.forEach(e => {
        categoryTotals[e.category] += e.amount;
    });

    const pieLabels = [];
    const pieData = [];
    const pieColors = [];

    Object.keys(categoryTotals).forEach(k => {
        if (categoryTotals[k] > 0) {
            pieLabels.push(categories[k].name);
            pieData.push(categoryTotals[k]);
            pieColors.push(categories[k].color);
        }
    });

    pieChart.data.labels = pieLabels;
    pieChart.data.datasets[0].data = pieData;
    pieChart.data.datasets[0].backgroundColor = pieColors;

    pieChart.options.plugins.tooltip.callbacks = {
        label: function (context) {
            const categoryKey = Object.keys(categories)
                .find(k => categories[k].name === context.label);

            const detailList = expenses
                .filter(e => e.category === categoryKey)
                .map(e => `• ${e.name}: ${formatMoney(e.amount)}`);

            return detailList;
        }
    };

    pieChart.update();

    /* ===== BAR CHART: THEO KHOẢN CHI CỤ THỂ ===== */
    barChart.data.labels = expenses.map(e => e.name);
    barChart.data.datasets[0].data = expenses.map(e => e.amount);
    barChart.data.datasets[0].backgroundColor = expenses.map(
        e => categories[e.category].color
    );

    barChart.update();
}


        // THÊM MỚI: Hàm toggle hiển thị/ẩn biểu đồ
        function toggleChartsVisibility() {
            const emptyState = document.getElementById('chartsEmptyState');
            const pieContainer = document.getElementById('pieChartContainer');
            const barContainer = document.getElementById('barChartContainer');
            
            if (expenses.length === 0) {
                // Không có dữ liệu: hiện empty state, ẩn biểu đồ
                emptyState.style.display = 'flex';
                pieContainer.classList.add('hidden');
                pieContainer.classList.remove('show');
                barContainer.classList.add('hidden');
                barContainer.classList.remove('show');
            } else {
                // Có dữ liệu: ẩn empty state, hiện biểu đồ với animation
                emptyState.style.display = 'none';
                pieContainer.classList.remove('hidden');
                pieContainer.classList.add('show');
                barContainer.classList.remove('hidden');
                barContainer.classList.add('show');
            }
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(amount);
        }
    </script>
